<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Flipo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#0F3B82;--teal:#14B8A6;--coral:#FF7F6E;--amber:#FBBF24;
  --bg:#F7FAFD;--surface:#FFFFFF;--soft:#EEF6FC;--ink:#0F3B82;--text:#22324F;--muted:#5A6A86;--line:#DCE7F2;
  --primary:#0F3B82;--primary-ink:#FFFFFF;--danger:#D9533F;
  --ok:#0B8A7C;--warn:#A86F00;--ko:#D9533F;
  --shadow:0 1px 2px rgba(15,59,130,.06),0 8px 24px rgba(15,59,130,.08);
  --radius:16px;
  color-scheme:light;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0B1730;--surface:#122449;--soft:#172D58;--ink:#E8F4FB;--text:#D5E1F2;--muted:#9AABC8;--line:#26416F;
    --primary:#2C6BD6;--primary-ink:#FFFFFF;--danger:#FF8E7F;
    --ok:#2DD4BF;--warn:#FBBF24;--ko:#FF8E7F;
    --shadow:0 8px 24px rgba(0,0,0,.35);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0B1730;--surface:#122449;--soft:#172D58;--ink:#E8F4FB;--text:#D5E1F2;--muted:#9AABC8;--line:#26416F;
  --primary:#2C6BD6;--primary-ink:#FFFFFF;--danger:#FF8E7F;
  --ok:#2DD4BF;--warn:#FBBF24;--ko:#FF8E7F;
  --shadow:0 8px 24px rgba(0,0,0,.35);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;min-height:100%;font-family:'Lexend',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:16px;line-height:1.55;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;overflow-x:hidden}
body::before{content:"";position:fixed;right:-170px;top:-170px;width:440px;height:440px;border-radius:50%;background:var(--soft);z-index:-1}
body::after{content:"";position:fixed;left:-130px;bottom:-130px;width:300px;height:300px;border-radius:50%;background:color-mix(in srgb,var(--amber) 15%,transparent);z-index:-1}
button,input,select,textarea{font-family:inherit}
a{color:inherit}
:focus-visible{outline:3px solid var(--teal);outline-offset:2px}

/* En-tête */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top-in{max-width:1240px;margin:0 auto;padding:10px 20px;display:flex;align-items:center;gap:22px}
.brand{display:flex;align-items:center;gap:10px;padding:4px;color:var(--ink);border-radius:10px;text-decoration:none}
.logo{width:38px;height:38px;flex:none}
.word{font-size:27px;font-weight:700;letter-spacing:-.03em;line-height:1}
.word .u{color:var(--teal)}
.tabs{display:flex;gap:2px;margin-right:auto}
.tab{font-size:15px;font-weight:500;color:var(--muted);text-decoration:none;padding:10px 14px;border-radius:10px;position:relative}
.tab:hover{color:var(--ink)}
.tab.on{color:var(--ink);font-weight:600}
.tab.on::after{content:"";position:absolute;left:14px;right:14px;bottom:1px;height:3px;border-radius:3px;background:var(--teal)}
.mode{display:inline-flex;align-items:center;gap:8px;font-size:14px;font-weight:600;padding:8px 14px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);color:var(--muted);cursor:pointer}
.mode.on{background:var(--teal);border-color:var(--teal);color:#fff}

.wrap{max-width:1240px;margin:0 auto;padding:30px 20px 72px}
h1{font-size:clamp(28px,3.2vw,38px);line-height:1.15;color:var(--ink);margin:0;font-weight:700;letter-spacing:-.02em}
h2{font-size:20px;line-height:1.3;color:var(--ink);font-weight:600;margin:0}
.lead{color:var(--muted);margin:8px 0 0;max-width:58ch}
.muted{color:var(--muted)}

/* Bibliothèque */
.lib-head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:22px}
.search{display:flex;align-items:center;gap:10px;background:var(--surface);border:1.5px solid var(--line);border-radius:999px;padding:0 8px 0 16px;width:min(400px,100%);color:var(--muted)}
.search input{border:0;background:none;font:inherit;color:var(--text);padding:12px 0;flex:1;outline:none;min-width:0}
.search:focus-within{border-color:var(--teal);box-shadow:0 0 0 4px color-mix(in srgb,var(--teal) 20%,transparent)}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:24px}
.chip{font:inherit;font-size:14px;font-weight:500;padding:7px 14px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);color:var(--muted);cursor:pointer}
.chip.on{border-color:var(--teal);background:color-mix(in srgb,var(--teal) 12%,var(--surface));color:var(--ink);font-weight:600}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:20px}
.card-wrap{position:relative}
.scard{height:100%;display:flex;flex-direction:column;gap:14px;text-decoration:none;color:inherit;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px;box-shadow:var(--shadow);transition:transform .15s;position:relative;overflow:hidden}
.scard:hover{transform:translateY(-2px)}
.s-top{display:flex;flex-direction:column;justify-content:center;gap:2px;min-height:96px;border-radius:10px;padding:14px 16px;background:color-mix(in srgb,var(--dot) 13%,var(--surface));border-left:5px solid var(--dot)}
.sample{font-size:24px;font-weight:600;color:var(--ink);letter-spacing:-.01em;line-height:1.2;overflow-wrap:anywhere}
.sv{font-size:13px;color:var(--muted)}
.s-body{display:flex;flex-direction:column;gap:2px;padding:0 4px}
.s-body strong{color:var(--ink);font-weight:600;font-size:17px;line-height:1.3}
.s-body .muted{font-size:14px;line-height:1.35}
.s-foot{display:flex;gap:8px;align-items:center;padding:0 4px 2px;margin-top:auto;flex-wrap:wrap}
.pill{font-size:12.5px;font-weight:500;color:var(--muted);background:var(--soft);padding:3px 10px;border-radius:999px}
.pill.draft{color:var(--warn);background:color-mix(in srgb,var(--amber) 20%,var(--surface))}
.mini-bar{height:5px;border-radius:5px;background:var(--line);overflow:hidden;margin:0 4px}
.mini-bar span{display:block;height:100%;background:var(--dot);border-radius:5px}
.done{margin-left:auto;font-size:12.5px;font-weight:500;color:var(--muted);display:inline-flex;align-items:center;gap:4px}
.done.all{color:var(--ok)}
.edit-fab{position:absolute;top:20px;right:20px;width:38px;height:38px;border-radius:50%;border:0;background:var(--surface);color:var(--ink);box-shadow:var(--shadow);display:grid;place-items:center;cursor:pointer}
.scard.new{border:2px dashed color-mix(in srgb,var(--teal) 55%,var(--line));background:var(--soft);align-items:center;justify-content:center;text-align:center;min-height:250px;color:var(--ink);box-shadow:none;gap:8px;cursor:pointer;font:inherit;width:100%}
.scard.new svg{color:var(--teal);margin-bottom:6px}
.scard.new strong{font-size:17px}
.scard.new span{color:var(--muted);font-size:14px;max-width:24ch}
.empty{text-align:center;padding:60px 20px;background:var(--surface);border-radius:20px;border:1px solid var(--line)}
.empty svg{color:var(--teal)}
.empty h2{margin:12px 0 6px}
.empty p{color:var(--muted);margin:0 auto 18px;max-width:44ch}

/* Résultats de recherche */
.results-h{font-size:14px;color:var(--muted);margin:0 0 12px}
.results{display:flex;flex-direction:column;gap:8px}
.res{display:flex;align-items:center;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px 10px 16px;border-left:5px solid var(--dot)}
.res .w{flex:1;min-width:0;display:flex;flex-wrap:wrap;gap:2px 14px;align-items:baseline}
.res .es{font-weight:600;color:var(--ink);font-size:17px}
.res .fr{color:var(--text)}
.res .seqlink{font-size:12.5px;font-weight:500;color:var(--muted);text-decoration:none;background:var(--soft);padding:3px 10px;border-radius:999px;white-space:nowrap}
.res .seqlink:hover{color:var(--ink)}
mark{background:color-mix(in srgb,var(--amber) 45%,transparent);color:inherit;border-radius:3px;padding:0 1px}

/* Boutons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:600;font-size:15px;border-radius:10px;padding:11px 18px;cursor:pointer;border:1.5px solid transparent;line-height:1.2;text-align:center;text-decoration:none}
.btn.primary{background:var(--primary);color:var(--primary-ink)}
.btn.primary:hover{filter:brightness(1.12)}
.btn.primary:disabled{opacity:.55;cursor:not-allowed}
.btn.secondary{background:var(--surface);color:var(--ink);border-color:var(--ink)}
.btn.ghost{background:var(--surface);color:var(--ink);border-color:var(--line)}
.btn.ghost:hover,.btn.ghost.on{border-color:var(--teal)}
.btn.ghost.on{background:color-mix(in srgb,var(--teal) 12%,var(--surface))}
.btn.danger{background:transparent;color:var(--danger);border-color:color-mix(in srgb,var(--coral) 55%,transparent)}
.btn.danger.armed{background:var(--coral);color:#fff;border-color:var(--coral)}
.btn.ok-b{background:color-mix(in srgb,var(--ok) 14%,var(--surface));color:var(--ok);border-color:color-mix(in srgb,var(--ok) 50%,transparent)}
.btn.ko-b{background:color-mix(in srgb,var(--coral) 14%,var(--surface));color:var(--ko);border-color:color-mix(in srgb,var(--coral) 55%,transparent)}
.btn.sm{font-size:14px;padding:8px 12px}
.link{display:inline-flex;align-items:center;gap:6px;background:none;border:0;font-weight:500;font-size:15px;color:var(--muted);cursor:pointer;padding:6px 4px;border-radius:8px;text-decoration:none}
.link:hover{color:var(--ink)}
.icon-btn{width:34px;height:34px;border-radius:50%;border:0;background:transparent;color:var(--muted);display:grid;place-items:center;cursor:pointer;flex:none;padding:0}
.icon-btn:hover{background:var(--soft);color:var(--ink)}
.icon-btn.known{color:var(--ok)}
.btns{display:flex;flex-wrap:wrap;gap:10px;align-items:center}

/* Page d'une séquence */
.crumbs{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.seq-head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:18px;margin-bottom:22px}
.seq-chip{display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:600;color:var(--ink);background:color-mix(in srgb,var(--dot) 16%,var(--surface));padding:4px 12px 4px 10px;border-radius:999px;margin-bottom:10px}
.seq-chip::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--dot)}
.prog-box{display:flex;flex-direction:column;gap:6px;min-width:220px}
.prog-box .count{font-size:13.5px;color:var(--muted)}
.bar{height:8px;border-radius:8px;background:var(--line);overflow:hidden}
.bar span{display:block;height:100%;background:var(--teal);border-radius:8px;transition:width .4s}
.seg{display:inline-flex;background:var(--soft);border-radius:12px;padding:4px;gap:4px;margin-bottom:18px;flex-wrap:wrap}
.seg-b{display:inline-flex;align-items:center;gap:7px;font-size:14.5px;font-weight:500;color:var(--muted);background:none;border:0;border-radius:9px;padding:8px 14px;cursor:pointer;text-decoration:none}
.seg-b.on{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:0 1px 3px rgba(15,59,130,.12)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:clamp(18px,3vw,28px);box-shadow:var(--shadow);min-width:0}
.tools{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.tools .seg{margin:0}
.cat{margin-bottom:26px}
.cat:last-child{margin-bottom:0}
.cat-h{display:flex;align-items:center;gap:10px;font-size:14px;font-weight:600;color:var(--muted);margin:0 0 8px;text-transform:uppercase;letter-spacing:.04em}
.cat-h .n{font-weight:400;text-transform:none;letter-spacing:0}
.vtable{width:100%;border-collapse:collapse}
.vtable td{padding:9px 8px;vertical-align:middle}
.vtable tr+tr td{border-top:1px solid color-mix(in srgb,var(--line) 70%,transparent)}
.vtable .c-es{width:46%}
.vtable .c-fr{width:46%}
.vtable .c-act{width:1%;white-space:nowrap;text-align:right}
.vtable .c-act .icon-btn{display:inline-grid;vertical-align:middle}
.v-es{font-weight:600;color:var(--ink);font-size:16.5px}
.v-ex{display:block;font-size:13.5px;color:var(--muted);font-style:italic;font-weight:400;margin-top:2px}
.v-fr{color:var(--text)}
.reveal{font:inherit;font-size:13px;font-weight:600;color:var(--muted);background:var(--soft);border:1.5px dashed var(--line);border-radius:8px;padding:3px 14px;cursor:pointer;min-width:90px}
.reveal:hover{border-color:var(--teal);color:var(--ink)}
.flash-row td{animation:flash 1.6s ease-out}
@keyframes flash{0%{background:color-mix(in srgb,var(--amber) 40%,transparent)}100%{background:transparent}}

/* Réglages d'un entraînement */
.setup{display:flex;flex-direction:column;gap:20px;max-width:640px}
.setup h3{margin:0 0 8px;font-size:14px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{display:inline-flex;align-items:center;gap:8px;font:inherit;font-size:14.5px;font-weight:500;padding:9px 15px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);color:var(--text);cursor:pointer;text-align:left}
.opt.on{border-color:var(--teal);background:color-mix(in srgb,var(--teal) 12%,var(--surface));color:var(--ink);font-weight:600}
.opt small{display:block;font-weight:400;color:var(--muted);font-size:12.5px}
.picks{display:flex;flex-wrap:wrap;gap:8px}
.pick{display:inline-flex;align-items:center;gap:8px;font:inherit;font-size:14.5px;font-weight:500;padding:8px 14px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);color:var(--text);cursor:pointer}
.pick::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--dot);opacity:.35}
.pick.on{border-color:var(--dot);background:color-mix(in srgb,var(--dot) 14%,var(--surface));color:var(--ink);font-weight:600}
.pick.on::before{opacity:1}

/* Cartes mémoire */
.fc-wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;align-items:center;gap:16px}
.fc-count{font-size:13.5px;color:var(--muted);margin:0}
.fc{width:100%;min-height:250px;perspective:1200px;cursor:pointer;border:0;background:none;padding:0;font:inherit;color:inherit}
.fc-in{position:relative;width:100%;min-height:250px;transition:transform .45s;transform-style:preserve-3d}
.fc.flip .fc-in{transform:rotateY(180deg)}
.fc-face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:28px;text-align:center;border:1px solid var(--line);box-shadow:var(--shadow);background:var(--surface)}
.fc-face.back{transform:rotateY(180deg);background:color-mix(in srgb,var(--dot) 10%,var(--surface));border-color:color-mix(in srgb,var(--dot) 45%,var(--line))}
.fc-lang{font-size:12.5px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.fc-word{font-size:clamp(26px,5vw,36px);font-weight:700;color:var(--ink);line-height:1.2;letter-spacing:-.01em;overflow-wrap:anywhere}
.fc-hint{font-size:13px;color:var(--muted);margin-top:8px}
.fc-ex{font-size:14.5px;font-style:italic;color:var(--muted);max-width:40ch}
.fc-btns{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}

/* Test */
.drill{max-width:620px;margin:0 auto;text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px}
.dots{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-bottom:10px}
.dot{width:12px;height:12px;border-radius:50%;background:var(--line)}
.dot.cur{background:var(--surface);box-shadow:0 0 0 2.5px var(--teal)}
.dot.ok{background:var(--ok)}
.dot.accent{background:var(--amber)}
.dot.ko{background:var(--ko)}
.dr-count{font-size:13.5px;color:var(--muted);margin:0}
.dr-ask{font-size:14px;color:var(--muted);margin:14px 0 0}
.dr-word{font-size:clamp(28px,5vw,38px);font-weight:700;color:var(--ink);margin:2px 0 4px;line-height:1.15;letter-spacing:-.02em;overflow-wrap:anywhere}
.dr-seq{font-size:13px;color:var(--muted);margin:0 0 16px}
.dr-row{display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap;width:100%}
.dr-in{font:inherit;font-size:22px;font-weight:600;color:var(--ink);text-align:center;width:min(360px,100%);padding:6px 10px;background:var(--surface);border:0;border-bottom:2.5px solid var(--muted);border-radius:6px 6px 0 0;outline:none}
.dr-in:focus{border-bottom-color:var(--teal);background:color-mix(in srgb,var(--teal) 10%,var(--surface))}
.dr-in.ok{border-bottom-color:var(--ok);color:var(--ok)}
.dr-in.accent{border-bottom-color:var(--amber);color:var(--warn)}
.dr-in.ko{border-bottom-color:var(--ko);color:var(--ko);text-decoration:line-through;text-decoration-thickness:1.5px}
.qcm{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%}
.qo{font:inherit;font-size:16.5px;font-weight:500;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:14px 16px;cursor:pointer;text-align:center;min-height:58px;display:flex;align-items:center;justify-content:center;gap:8px}
.qo:hover:not(:disabled){border-color:var(--teal)}
.qo:disabled{cursor:default}
.qo kbd{font:inherit;font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:5px;padding:0 6px}
.qo.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 13%,var(--surface));color:var(--ok);font-weight:600}
.qo.ko{border-color:var(--ko);background:color-mix(in srgb,var(--coral) 13%,var(--surface));color:var(--ko)}
.qo.dim{opacity:.5}
.fb{margin:10px 0 0;font-size:16px;display:flex;align-items:center;justify-content:center;gap:6px;flex-wrap:wrap;min-height:1.6em}
.fb.ok{color:var(--ok)}
.fb.accent{color:var(--warn)}
.fb.ko{color:var(--ko)}
.fb b{color:var(--ink)}
.acc{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:6px;margin:16px 0 0}
.acc-b{font:inherit;font-size:17px;font-weight:500;width:40px;height:40px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.acc-b:hover{border-color:var(--teal)}
.score{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding:16px 18px;border-radius:14px;background:color-mix(in srgb,var(--teal) 12%,var(--surface));border:1px solid color-mix(in srgb,var(--teal) 35%,transparent);margin-bottom:16px;width:100%;text-align:left}
.score strong{font-size:30px;line-height:1;color:var(--ink);font-weight:700}
.score span{color:var(--text);flex:1;min-width:180px}
.recap{list-style:none;margin:6px 0 16px;padding:0;width:100%;text-align:left;display:flex;flex-direction:column;gap:6px}
.recap li{background:var(--soft);border-radius:10px;padding:8px 14px;font-size:15px;display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline}
.recap .q{color:var(--muted)}
.recap .y{color:var(--ko);text-decoration:line-through}
.recap .a{color:var(--ink);font-weight:600}
.recap-h{align-self:flex-start;font-size:14px;font-weight:600;color:var(--muted);margin:6px 0 0}

/* Édition */
.ed-wrap{max-width:960px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.field{display:flex;flex-direction:column;gap:6px;font-size:14px;font-weight:500;color:var(--ink)}
.field input,.field textarea,.field select{font:inherit;font-size:15px;font-weight:400;color:var(--text);background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:9px 12px;width:100%}
.field textarea{resize:vertical;line-height:1.55}
.field textarea.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:14px}
.field input:focus,.field textarea:focus,.field select:focus{outline:none;border-color:var(--teal);box-shadow:0 0 0 3px color-mix(in srgb,var(--teal) 20%,transparent)}
.help{font-size:13px;font-weight:400;color:var(--muted);line-height:1.5}
.help code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12.5px;background:var(--soft);padding:1px 5px;border-radius:5px;color:var(--ink)}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.fields .full{grid-column:1/-1}
.radios{display:flex;flex-wrap:wrap;gap:8px}
.radios label{display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:400;color:var(--text);padding:7px 12px;border:1.5px solid var(--line);border-radius:999px;cursor:pointer;background:var(--surface)}
.field .radios input{accent-color:var(--teal);margin:0;width:auto;padding:0;border:0;flex:none}
.swatch{flex:none}
.radios label:has(input:checked){border-color:var(--teal);background:color-mix(in srgb,var(--teal) 12%,var(--surface))}
.swatch{width:14px;height:14px;border-radius:50%;background:var(--dot)}
.ed-cols{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:18px;align-items:start}
.status{font-size:13.5px;font-weight:500;margin:0;display:flex;flex-direction:column;gap:4px}
.status .okk{color:var(--ok)}
.status .err{color:var(--danger);font-weight:400}
.status .wrn{color:var(--warn);font-weight:400}
.preview{background:var(--soft);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:10px;position:sticky;top:86px;max-height:calc(100vh - 110px);overflow:auto}
.preview h3{margin:0;font-size:14px;color:var(--ink)}
.pv-cat{font-size:12.5px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin-top:4px}
.pv-w{font-size:14px;display:flex;gap:6px;flex-wrap:wrap}
.pv-w b{color:var(--ink);font-weight:600}
.toolbar{display:flex;flex-wrap:wrap;gap:8px}
.save-bar{position:sticky;bottom:12px;z-index:5;display:flex;flex-wrap:wrap;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;box-shadow:var(--shadow)}
.save-bar .spacer{flex:1}

.credit{max-width:1240px;margin:0 auto;padding:22px 20px 30px;border-top:1px solid var(--line);font-size:13px;color:var(--muted);display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.credit .logo{width:22px;height:22px}
.credit .spacer{flex:1}
.credit .link{font-size:13px}
.loading{padding:80px 20px;text-align:center;color:var(--muted)}
.repo{font-size:13px;color:var(--muted);margin:-8px 0 22px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.repo code{font-family:inherit;font-weight:600;color:var(--ink)}
.modal-bg{position:fixed;inset:0;z-index:40;background:rgba(11,23,48,.55);display:grid;place-items:center;padding:20px}
.modal{background:var(--surface);color:var(--text);border-radius:20px;padding:26px;width:min(460px,100%);box-shadow:0 24px 60px rgba(0,0,0,.3);display:flex;flex-direction:column;gap:16px;max-height:90vh;overflow:auto}
.modal h2{display:flex;align-items:center;gap:10px}
.modal p{margin:0;font-size:14.5px;color:var(--muted)}
.check{display:flex;align-items:center;gap:8px;font-size:14px}
.check input{accent-color:var(--teal);width:17px;height:17px}
.modal .err{color:var(--danger);font-size:14px;font-weight:500}
.modal .btns{justify-content:flex-end}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,16px);opacity:0;pointer-events:none;background:#0F3B82;color:#fff;padding:12px 18px;border-radius:12px;font-size:14.5px;max-width:min(90vw,480px);box-shadow:0 12px 32px rgba(15,59,130,.3);transition:opacity .2s,transform .2s;z-index:60}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media (max-width:860px){
  .ed-cols{grid-template-columns:1fr}
  .preview{position:static;max-height:none}
}
@media (max-width:600px){
  .top-in{gap:10px;padding:8px 14px}
  .word{font-size:22px}
  .logo{width:32px;height:32px}
  .tab{padding:10px 8px;font-size:14px}
  .tab.on::after{left:8px;right:8px}
  .mode span{display:none}
  .mode{padding:8px 10px}
  .wrap{padding:22px 16px 64px}
  .fields{grid-template-columns:1fr}
  .qcm{grid-template-columns:1fr}
  .seg-b{padding:8px 10px}
  .vtable td{padding:8px 4px}
  .v-es{font-size:15.5px}
  .vtable .c-es,.vtable .c-fr{width:auto}
}

/* Propre à Flipo */
.fc-word.long{font-size:clamp(18px,3vw,22px);font-weight:600;line-height:1.4}
.dr-word.long{font-size:clamp(18px,3vw,22px);font-weight:600;line-height:1.4}
.qo.long{font-size:14.5px;text-align:left;justify-content:flex-start}
.owner{font-size:12.5px;color:var(--muted);display:inline-flex;align-items:center;gap:5px}
.lib-tools{display:flex;flex-wrap:wrap;gap:10px;margin:-6px 0 22px}
.imp-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;font-size:14.5px}
.imp-list li{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap;background:var(--soft);border-radius:10px;padding:8px 12px}
.imp-list .tag{font-size:12px;font-weight:600;color:var(--ok)}
.imp-list .tag.upd{color:var(--warn)}
.modal.wide{width:min(560px,100%)}
.file-btn{position:relative;overflow:hidden}
.file-btn input{position:absolute;inset:0;opacity:0;cursor:pointer}

<body>
<div id="app"></div>
<script>
(function(){
'use strict';

/* ============ CONFIGURATION ============
   Laisse vide : le dépôt est détecté automatiquement depuis l'adresse
   https://<utilisateur>.github.io/<depot>/
   À remplir seulement pour un nom de domaine personnalisé. */
var CONFIG={owner:'',repo:''};
/* ======================================= */

var CREDIT_TXT='Copyright Lucas Le Coadou - Professeur d’espagnol dans l’académie de Montpellier';
var COLORS={
  teal:{dot:'#14B8A6',label:'Turquoise'},
  blue:{dot:'#2C6BD6',label:'Bleu'},
  coral:{dot:'#FF7F6E',label:'Corail'},
  amber:{dot:'#FBBF24',label:'Ambre'},
  violet:{dot:'#8B5CF6',label:'Violet'},
  green:{dot:'#22A55A',label:'Vert'}
};
var COLOR_KEYS=Object.keys(COLORS);
/* Langue du recto : prononciation et clavier de lettres spéciales */
var LANGS={
  '':{label:'Aucune',voice:null,acc:[]},
  fr:{label:'Français',voice:'fr-FR',acc:['é','è','ê','à','â','ç','ù','î','ô','œ']},
  es:{label:'Espagnol',voice:'es-ES',acc:['á','é','í','ó','ú','ñ','ü','¡','¿']},
  en:{label:'Anglais',voice:'en-GB',acc:[]},
  de:{label:'Allemand',voice:'de-DE',acc:['ä','ö','ü','ß']},
  it:{label:'Italien',voice:'it-IT',acc:['à','è','é','ì','ò','ù']}
};
var DEFAULT_CAT='Cartes';
var LONG=60;

var ICONS={
  search:'<circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>',
  pen:'<path d="M4 20h4L19 9l-4-4L4 16v4z"/>',
  plus:'<path d="M12 5v14M5 12h14"/>',
  x:'<path d="M6 6l12 12M18 6 6 18"/>',
  back:'<path d="M15 18l-6-6 6-6"/>',
  check:'<path d="m5 12 5 5 9-10"/>',
  chev:'<path d="m9 6 6 6-6 6"/>',
  refresh:'<path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/>',
  list:'<path d="M9 6h11M9 12h11M9 18h11"/><circle cx="4.5" cy="6" r="1"/><circle cx="4.5" cy="12" r="1"/><circle cx="4.5" cy="18" r="1"/>',
  cards:'<rect x="3" y="6" width="14" height="15" rx="2"/><path d="M7 3h12a2 2 0 0 1 2 2v12"/>',
  target:'<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/>',
  eye:'<path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>',
  eyeoff:'<path d="M3 3l18 18"/><path d="M10.6 5.1A10 10 0 0 1 12 5c6.4 0 10 7 10 7a17 17 0 0 1-3.2 4.1M6.6 6.6C3.8 8.4 2 12 2 12s3.6 7 10 7a9.6 9.6 0 0 0 5.4-1.6"/>',
  trophy:'<path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0z"/><path d="M17 5h3v2a3 3 0 0 1-3 3M7 5H4v2a3 3 0 0 0 3 3"/>',
  star:'<path d="m12 3 2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1-4.4-4.3 6.1-.9z"/>',
  book:'<path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z"/><path d="M4 21V5"/>',
  sound:'<path d="M4 9v6h4l5 4V5L8 9z"/><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/>',
  shuffle:'<path d="M3 7h3c5 0 7 10 12 10h3M3 17h3c1.6 0 2.8-1 3.8-2.3M14.2 9.3C15.2 8 16.4 7 18 7h3"/><path d="m18 4 3 3-3 3M18 14l3 3-3 3"/>',
  sort:'<path d="M7 4v16M3 16l4 4 4-4M14 6h7M14 12h5M14 18h3"/>',
  upload:'<path d="M12 16V4M7 9l5-5 5 5"/><path d="M4 16v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3"/>',
  download:'<path d="M12 4v12M7 11l5 5 5-5"/><path d="M4 16v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3"/>',
  user:'<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>'
};
function ic(n,s){s=s||20;return '<svg class="i" viewBox="0 0 24 24" width="'+s+'" height="'+s+'" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+ICONS[n]+'</svg>';}

/* Logo : deux cartes (bleue et turquoise) en train de se retourner, avec une flèche ambre */
var LOGO='<svg class="logo" viewBox="0 0 48 48" aria-hidden="true"><rect x="19" y="8" width="24" height="31" rx="5" fill="#14B8A6" transform="rotate(12 31 23.5)"/><rect x="5" y="11" width="24" height="31" rx="5" fill="#0F3B82"/><path d="M11 22h12M11 28h8" stroke="#E8F4FB" stroke-width="2.6" stroke-linecap="round" opacity=".85"/><path d="M14 5.5c5-3 12-3 17 1.5" fill="none" stroke="#FBBF24" stroke-width="3.2" stroke-linecap="round"/><path d="m31.5 2.5.2 5-5 .3" fill="none" stroke="#FBBF24" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>';

/* CORE START : fonctions pures, testées par test.mjs */
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function clone(o){return JSON.parse(JSON.stringify(o));}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var x=a[i];a[i]=a[j];a[j]=x;}return a;}
function arr(x){return Array.isArray(x)?x:[];}
function noAcc(s){return String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'');}
function slug(s){return noAcc(s).toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'')||'paquet';}
function nrm(s){return String(s||'').toLowerCase().replace(/[’`]/g,"'").replace(/[¡!¿?.,;:«»"()]/g,' ').replace(/\s+/g,' ').trim();}
function fold(s){return noAcc(nrm(s));}

var ARTS=/^(el|la|los|las|un|una|unos|unas|le|la|les|l'|une|des|du|de la|de l'|the|a|an|der|die|das|ein|eine|il|lo|gli|i|uno)\s+|^(l'|de l')/i;
function variants(ans){
  var out=[];
  String(ans||'').split('/').forEach(function(a){
    a=a.trim();if(!a)return;
    out.push(a.replace(/[()]/g,''));
    var short=a.replace(/\s*\([^)]*\)\s*/g,' ').trim();
    if(short&&out.indexOf(short)<0)out.push(short);
  });
  return out;
}
/* ok = juste · accent = presque (accent ou article oublié) · ko = faux.
   strict=false : les accents oubliés ne sont pas sanctionnés. */
function grade(v,ans,strict){
  var n=nrm(v);if(!n)return {r:'ko'};
  var vs=variants(ans);
  if(vs.some(function(a){return nrm(a)===n;}))return {r:'ok'};
  if(vs.some(function(a){return fold(a)===noAcc(n);}))return strict?{r:'accent',why:'accent'}:{r:'ok'};
  if(vs.some(function(a){var s=nrm(a).replace(ARTS,'');return s!==nrm(a)&&noAcc(s)===noAcc(n);}))return {r:'accent',why:'article'};
  return {r:'ko'};
}

/* CSV : séparateur ; , ou tabulation détecté sur la 1re ligne, guillemets gérés (RFC 4180) */
function parseCSV(text){
  text=String(text||'').replace(/^﻿/,'');
  var first=text.split(/\r?\n/)[0]||'',counts={';':0,',':0,'\t':0},q=false;
  for(var k=0;k<first.length;k++){var c0=first[k];if(c0==='"')q=!q;else if(!q&&counts[c0]!=null)counts[c0]++;}
  var sep=Object.keys(counts).sort(function(a,b){return counts[b]-counts[a];})[0];
  if(!counts[sep])sep=';';
  var rows=[],row=[],f='',i=0,inq=false;
  while(i<text.length){
    var c=text[i];
    if(inq){
      if(c==='"'){if(text[i+1]==='"'){f+='"';i++;}else inq=false;}
      else f+=c;
    }else if(c==='"'&&f==='')inq=true;
    else if(c===sep){row.push(f);f='';}
    else if(c==='\n'||c==='\r'){if(c==='\r'&&text[i+1]==='\n')i++;row.push(f);rows.push(row);row=[];f='';}
    else f+=c;
    i++;
  }
  if(f!==''||row.length){row.push(f);rows.push(row);}
  return rows.filter(function(r){return r.some(function(x){return x.trim();});});
}
var CSV_COLS={
  q:['recto','question','terme','mot','notion','front','face'],
  a:['verso','reponse','definition','traduction','back','dos'],
  ex:['exemple','indice','aide','hint','precision'],
  cat:['categorie','theme','rubrique','partie'],
  deck:['paquet','deck','sequence','chapitre','titre'],
  level:['classe','niveau']
};
/* Lignes CSV → cartes. Avec une ligne d'en-tête, les colonnes sont reconnues par leur nom
   (dans n'importe quel ordre) ; sinon : recto, verso, exemple, catégorie. */
function csvCards(rows){
  var map=null,h=rows[0]||[];
  var found={};
  h.forEach(function(name,i){
    var n=fold(name).replace(/[^a-z]/g,'');
    Object.keys(CSV_COLS).forEach(function(k){if(found[k]==null&&CSV_COLS[k].some(function(x){return n===x||n.indexOf(x)===0;}))found[k]=i;});
  });
  if(found.q!=null&&found.a!=null){map=found;rows=rows.slice(1);}
  else map={q:0,a:1,ex:2,cat:3};
  var cards=[],errs=[],off=map===found?2:1;
  rows.forEach(function(r,i){
    var g=function(k){return map[k]==null?'':String(r[map[k]]||'').trim();};
    var c={q:g('q'),a:g('a'),ex:g('ex'),cat:g('cat'),deck:g('deck'),level:g('level')};
    if(!c.q||!c.a){errs.push(i+off);return;}
    cards.push(c);
  });
  return {cards:cards,errs:errs,hasDeck:map.deck!=null};
}
/* Une ligne par carte : "recto = verso | exemple", ou colonnes collées d'un tableur. "## Titre" = catégorie. */
function parseCards(raw){
  var ok=[],errs=[],dups=[],cat='',seen={};
  String(raw||'').split(/\r?\n/).forEach(function(line,i){
    var l=line.trim();if(!l)return;
    if(/^##\s*/.test(l)){cat=l.replace(/^#+\s*/,'').trim();return;}
    var q,a,ex='';
    if(line.indexOf('\t')>=0){
      var cols=line.split('\t').map(function(c){return c.trim();});
      q=cols[0];a=cols[1]||'';ex=cols[2]||'';
      if(cols[3])cat=cols[3];
    }else{
      var bar=l.indexOf(' | ');
      if(bar>=0){ex=l.slice(bar+3).trim();l=l.slice(0,bar).trim();}
      var m=l.match(/^(.+?)\s*=\s*(.+)$/);
      if(m){q=m[1].trim();a=m[2].trim();}
    }
    if(!q||!a){errs.push({n:i+1,l:l});return;}
    var k=fold(q);if(seen[k])dups.push(q);seen[k]=1;
    ok.push({q:q,a:a,cat:cat,ex:ex});
  });
  return {ok:ok,errs:errs,dups:dups};
}
function toRaw(cards){
  var out=[],cur=null;
  cards.forEach(function(w){
    var c=w.cat||'';
    if(c!==cur){if(out.length)out.push('');if(c)out.push('## '+c);cur=c;}
    out.push(w.q+' = '+w.a+(w.ex?' | '+w.ex:''));
  });
  return out.join('\n');
}
/* Ajoute à des paquets existants (même titre, même prof) ou en crée, sans doublon de recto. */
function mergeImport(decks,groups,me){
  var res=[];
  groups.forEach(function(g){
    var d=decks.filter(function(x){return x.owner===me&&fold(x.title)===fold(g.title);})[0];
    var isNew=!d;
    if(isNew){
      var base=slug(g.title),id=base,i=2;
      while(decks.some(function(x){return x.id===id;}))id=base+'-'+(i++);
      d={id:id,title:g.title,desc:'',level:g.level||'',color:COLOR_KEYS[decks.length%COLOR_KEYS.length],lang:'',published:false,owner:me,ownerName:'',cards:[]};
      decks.push(d);
    }
    var seen={};d.cards.forEach(function(c){seen[fold(c.q)]=1;});
    var added=0;
    g.cards.forEach(function(c){if(seen[fold(c.q)])return;seen[fold(c.q)]=1;d.cards.push({q:c.q,a:c.a,ex:c.ex||'',cat:c.cat||''});added++;});
    if(g.level&&!d.level)d.level=g.level;
    d.updatedAt=Date.now();
    res.push({title:d.title,id:d.id,isNew:isNew,added:added,skipped:g.cards.length-added});
  });
  return res;
}
function groupByDeck(cards,fallback){
  var order=[],map={};
  cards.forEach(function(c){var t=c.deck||fallback||'Import';if(!map[t]){map[t]={title:t,level:'',cards:[]};order.push(t);}if(c.level&&!map[t].level)map[t].level=c.level;map[t].cards.push(c);});
  return order.map(function(t){return map[t];});
}
/* CORE END */

function colorOf(s){return (COLORS[s.color]||COLORS.teal).dot;}
function dotStyle(s){return '--dot:'+colorOf(s);}
function isLong(t){return String(t||'').length>LONG;}
function cheer(r){
  if(r>=1)return 'Parfait ! Tu connais toutes ces cartes.';
  if(r>=.8)return 'Très bien ! Encore un petit effort pour le sans-faute.';
  if(r>=.5)return 'Pas mal ! Revois les cartes ratées, puis recommence.';
  return 'Repasse par « Apprendre » et les cartes, puis réessaie.';
}

/* ---------- Données (data.json) ---------- */
var DATA={decks:[]};
function normC(w){return {q:String(w.q||'').trim(),a:String(w.a||'').trim(),cat:String(w.cat||'').trim(),ex:String(w.ex||'').trim()};}
function norm(s){
  s.title=s.title||'';s.desc=s.desc||'';s.level=s.level||'';
  s.color=COLORS[s.color]?s.color:'teal';
  s.lang=LANGS[s.lang]?s.lang:'';
  s.published=s.published!==false;
  s.owner=s.owner||'';s.ownerName=s.ownerName||s.owner;
  s.cards=arr(s.cards).map(normC).filter(function(w){return w.q&&w.a;});
  return s;
}
function getS(id){for(var i=0;i<DATA.decks.length;i++)if(DATA.decks[i].id===id)return DATA.decks[i];return null;}
function mine(s){return !!GH.me&&(s.owner===GH.me||GH.isAdmin);}
function canEdit(s){return ui.admin&&mine(s);}
function visible(){return DATA.decks.filter(function(s){return s.published||canEdit(s);});}
function cats(s){
  var order=[],map={};
  s.cards.forEach(function(w,i){var c=w.cat||DEFAULT_CAT;if(!map[c]){map[c]=[];order.push(c);}map[c].push({w:w,i:i});});
  return order.map(function(c){return {name:c,items:map[c]};});
}
function uniq(f){var l=[];visible().forEach(function(s){var v=f(s);if(v&&l.indexOf(v)<0)l.push(v);});return l;}
function levels(){return uniq(function(s){return s.level;});}
function teachers(){return uniq(function(s){return s.ownerName;});}
function sideLabel(s,recto){return recto?(s.lang?LANGS[s.lang].label:'Recto'):'Verso';}

/* ---------- Progression de l'élève (propre à chaque appareil) ---------- */
var PROG=(function(){try{return JSON.parse(localStorage.getItem('flipo-progress')||'{}')||{};}catch(e){return {};}})();
function wk(w){return fold(w.q)+'='+fold(w.a);}
function prog(id){var p=PROG[id]||{};p.known=arr(p.known);return p;}
function saveProg(id,p){PROG[id]=p;try{localStorage.setItem('flipo-progress',JSON.stringify(PROG));}catch(e){}}
function isKnown(sid,w){return prog(sid).known.indexOf(wk(w))>=0;}
function setKnown(sid,w,on){
  var p=prog(sid),k=wk(w),i=p.known.indexOf(k);
  if(on&&i<0)p.known.push(k);else if(!on&&i>=0)p.known.splice(i,1);else return;
  saveProg(sid,p);
}
function knownCount(s){var p=prog(s.id);return s.cards.filter(function(w){return p.known.indexOf(wk(w))>=0;}).length;}
function recordBest(id,sc,n){var p=prog(id);if(p.best==null||sc/n>p.best/p.total){p.best=sc;p.total=n;saveProg(id,p);}}

var CAN_SPEAK='speechSynthesis' in window&&'SpeechSynthesisUtterance' in window;
function speak(t,lang){
  if(!CAN_SPEAK||!LANGS[lang]||!LANGS[lang].voice)return;
  var code=LANGS[lang].voice,vs=speechSynthesis.getVoices();
  var v=vs.filter(function(x){return x.lang.replace('_','-')===code;})[0]||vs.filter(function(x){return x.lang.indexOf(lang)===0;})[0];
  speechSynthesis.cancel();
  var u=new SpeechSynthesisUtterance(String(t).replace(/\//g,', ').replace(/[()]/g,''));
  u.lang=code;u.rate=.9;if(v)u.voice=v;speechSynthesis.speak(u);
}
function speakBtn(s,t,sm){return CAN_SPEAK&&s.lang?'<button class="icon-btn" data-action="speak" data-l="'+s.lang+'" data-t="'+esc(t)+'" aria-label="Écouter « '+esc(t)+' »" title="Écouter">'+ic('sound',sm||18)+'</button>':'';}

function hl(text,q){
  var t=String(text),ft=noAcc(t.toLowerCase()),fq=noAcc(q.toLowerCase().trim());
  if(!fq)return esc(t);
  var out='',i=0,j;
  while((j=ft.indexOf(fq,i))>=0){out+=esc(t.slice(i,j))+'<mark>'+esc(t.slice(j,j+fq.length))+'</mark>';i=j+fq.length;}
  return out+esc(t.slice(i));
}

function viewTestSetup(s,defi){
  var set=defi?ui.defi:ui.tSet,pre=defi?'defi':'t';
  var total=defi?poolFor(defiIds()).length:s.cards.length;
  var ns=[10,20].filter(function(x){return x<total;}).concat([0]);
  return '<div class="setup">'+(defi?'':'<div><h2>Me tester</h2><p class="muted" style="margin:6px 0 0">Les cartes réussies passent dans « acquises », les cartes ratées reviennent à revoir.</p></div>')+
    '<div><h3>Type d’exercice</h3><div class="opts">'+optBtn(pre+'-mode','qcm',set.mode,'Choix multiple','Je reconnais la bonne réponse')+optBtn(pre+'-mode','ecrire',set.mode,'J’écris la réponse','Pour les réponses courtes')+'</div></div>'+
    '<div><h3>Sens</h3><div class="opts">'+optBtn(pre+'-dir','rv',set.dir,'Recto → Verso')+optBtn(pre+'-dir','vr',set.dir,'Verso → Recto')+optBtn(pre+'-dir','mix',set.dir,'Les deux')+'</div></div>'+
    '<div><h3>Nombre de questions</h3><div class="opts">'+ns.map(function(x){return optBtn(pre+'-n',String(x),String(set.n>=total?0:set.n),x?String(x):'Toutes ('+total+')');}).join('')+'</div></div>'+
    '<div class="btns"><button class="btn primary" data-action="'+pre+'-start" '+(total?'':'disabled')+'>'+ic('target',18)+' C’est parti</button></div></div>';
}
function poolFor(ids){
  var p=[];ids.forEach(function(id){var s=getS(id);if(s)s.cards.forEach(function(w){p.push({w:w,sid:id});});});return p;
}
function newTest(ctx,ids,set,only){
  var pool=poolFor(ids);
  var picks=only?only.slice():shuffle(pool);
  if(!only&&set.n&&set.n<picks.length)picks=picks.slice(0,set.n);
  var items=picks.map(function(it){
    var d=set.dir==='mix'?(Math.random()<.5?'rv':'vr'):set.dir,s=getS(it.sid)||{};
    /* La réponse au recto dans une langue étrangère : accents exigés et clavier de lettres spéciales */
    var q={w:it.w,sid:it.sid,d:d,ask:d==='rv'?it.w.q:it.w.a,ans:d==='rv'?it.w.a:it.w.q,lang:d==='vr'?(s.lang||'fr'):'fr'};
    q.strict=d==='vr'&&!!s.lang&&s.lang!=='fr';
    if(set.mode==='qcm'){
      var key=d==='rv'?'a':'q',seen={};seen[fold(q.ans)]=1;
      var same=shuffle(pool.filter(function(o){return o.sid===it.sid&&o.w.cat===it.w.cat;})),other=shuffle(pool.filter(function(o){return !(o.sid===it.sid&&o.w.cat===it.w.cat);}));
      var opts=[q.ans];
      same.concat(other).forEach(function(o){var v=o.w[key],f=fold(v);if(opts.length<4&&!seen[f]){seen[f]=1;opts.push(v);}});
      q.opts=shuffle(opts);
    }
    return q;
  });
  return {ctx:ctx,ids:ids,set:clone(set),items:items,i:0,val:'',res:[],phase:'ask',pick:null};
}
function viewRun(){
  var t=ui.test,n=t.items.length;
  if(t.i>=n){
    var sc=t.res.filter(function(r){return r.r==='ok';}).length,bad=t.res.filter(function(r){return r.r!=='ok';});
    return '<div class="drill"><div class="score" id="score"><strong>'+sc+' / '+n+'</strong><span>'+cheer(sc/n)+'</span></div>'+
      (bad.length?'<p class="recap-h">À revoir</p><ul class="recap">'+bad.map(function(r){
        return '<li><span class="q">'+esc(r.q.ask)+'</span>→ '+(r.v?'<span class="y">'+esc(r.v)+'</span>':'')+'<span class="a">'+esc(r.q.ans)+'</span></li>';
      }).join('')+'</ul>':'')+
      '<div class="btns" style="justify-content:center">'+(bad.length?'<button class="btn primary" data-action="t-retry">'+ic('refresh',18)+' Refaire mes erreurs</button>':'')+
      '<button class="btn '+(bad.length?'ghost':'primary')+'" data-action="t-again">'+ic('shuffle',18)+' Nouveau test</button><button class="btn ghost" data-action="t-stop">Changer les réglages</button></div></div>';
  }
  var q=t.items[t.i],done=t.phase==='fb',r=t.res[t.i],s=getS(q.sid)||{};

  var h='<div class="drill">'+(n<=40?dots:'')+'<p class="dr-count">Question '+(t.i+1)+' sur '+n+'</p>'+

    }).join('')+'</div>';
  }else{

  }

      r.r==='accent'?(r.why==='article'?'Presque ! N’oublie pas l’article : <b>'+esc(q.ans)+'</b>':'Presque ! Attention aux accents : <b>'+esc(q.ans)+'</b>'):

function tAnswer(v,pick){
  var t=ui.test;if(!t||t.phase!=='ask')return;
  var q=t.items[t.i],r;
  if(t.set.mode==='qcm'){t.pick=pick;r={r:fold(q.opts[pick])===fold(q.ans)?'ok':'ko'};v=q.opts[pick];}
  else{if(!nrm(v))return;r=grade(v,q.ans,q.strict);}
  r.q=q;r.v=r.r==='ok'?'':v;
  t.res[t.i]=r;t.phase='fb';
  setKnown(q.sid,q.w,r.r==='ok');
  if(t.i===t.items.length-1&&t.ctx!=='defi'){
    var sc=t.res.filter(function(x){return x.r==='ok';}).length;recordBest(t.ctx,sc,t.items.length);
  }
  ui.af=true;render();
}
function tNext(){

/* ===== GitHub : stockage et accès enseignant =====
   Chaque enseignant se connecte avec SA clé GitHub : son identifiant GitHub
   signe ses paquets, et il ne peut modifier que les siens (le propriétaire
   du dépôt peut tout modifier). La clé n'est jamais écrite dans le code. */
var GH={token:null,owner:'',repo:'',branch:'',dataSha:null,me:'',name:'',isAdmin:false};
(function(){
  if(CONFIG.owner&&CONFIG.repo){GH.owner=CONFIG.owner;GH.repo=CONFIG.repo;return;}
  var m=location.hostname.match(/^([^.]+)\.github\.io$/i);if(!m)return;
  var seg=location.pathname.split('/').filter(Boolean)[0];
  GH.owner=m[1];GH.repo=seg&&!/\.html?$/i.test(seg)?seg:location.hostname.toLowerCase();
})();
function ghFetch(url,opt){
  opt=opt||{};
  return fetch(url,{method:opt.method||'GET',cache:'no-store',
    headers:{'Authorization':'Bearer '+GH.token,'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'},
    body:opt.body?JSON.stringify(opt.body):undefined
  }).then(function(r){return r.text().then(function(t){var j=null;try{j=t?JSON.parse(t):null;}catch(x){}if(!r.ok){var e=new Error(j&&j.message||'HTTP '+r.status);e.status=r.status;throw e;}return j;});});
}
function ghApi(path,opt){return ghFetch('https://api.github.com/repos/'+GH.owner+'/'+GH.repo+path,opt);}
function b64enc(str){var by=new TextEncoder().encode(str),bin='';for(var i=0;i<by.length;i+=0x8000)bin+=String.fromCharCode.apply(null,by.subarray(i,i+0x8000));return btoa(bin);}
function b64dec(b){var bin=atob(b.replace(/\s/g,'')),by=new Uint8Array(bin.length);for(var i=0;i<bin.length;i++)by[i]=bin.charCodeAt(i);return new TextDecoder().decode(by);}
function ref(){return '?ref='+encodeURIComponent(GH.branch);}
function setData(j){DATA.decks=arr(j&&j.decks).map(norm);}
function loadDataFromGitHub(){
  /* L'API « contents » ne renvoie pas le contenu au-delà d'1 Mo : on passe alors par le blob */
  return ghApi('/contents/data.json'+ref()).then(function(f){
    GH.dataSha=f.sha;
    if(f.content)return setData(JSON.parse(b64dec(f.content)));
    return ghApi('/git/blobs/'+f.sha).then(function(b){setData(JSON.parse(b64dec(b.content)));});
  }).catch(function(e){if(e.status===404){GH.dataSha=null;DATA.decks=[];return;}throw e;});
}
/* Plusieurs enseignants écrivent dans le même fichier : on relit toujours la dernière
   version, on y applique SA modification, puis on enregistre. Si un collègue a
   enregistré entre-temps (conflit), on recommence. */
function commit(fn,msg,tries){
  tries=tries||0;
  return loadDataFromGitHub().then(function(){
    fn();
    var body={message:msg,content:b64enc(JSON.stringify({decks:DATA.decks},null,1)),branch:GH.branch};
    if(GH.dataSha)body.sha=GH.dataSha;
    return ghApi('/contents/data.json',{method:'PUT',body:body});
  }).then(function(r){GH.dataSha=r.content.sha;}).catch(function(e){
    if((e.status===409||e.status===422)&&tries<2)return commit(fn,msg,tries+1);
    return loadDataFromGitHub().catch(function(){}).then(function(){throw e;});
  });
}
function ghErr(e){
  if(!e||!e.status)return e&&e.message==='owner'?'Ce paquet appartient à un autre enseignant.':'Connexion à GitHub impossible. Vérifie ta connexion internet.';
  if(e.status===401)return 'Clé refusée par GitHub : elle est invalide ou a expiré.';
  if(e.status===403)return 'Cette clé n’a pas le droit d’écrire dans le dépôt. Demande au propriétaire de t’ajouter comme collaborateur, et vérifie les droits de la clé.';
  if(e.status===404)return 'Dépôt introuvable avec cette clé. Vérifie qu’elle donne accès à '+GH.owner+'/'+GH.repo+'.';
  return 'GitHub a répondu : '+e.message;
}
function tryLogin(token,remember){
  GH.token=token;
  return Promise.all([ghApi(''),ghFetch('https://api.github.com/user')]).then(function(r){
    var repo=r[0],user=r[1];
    if(!repo.permissions||!repo.permissions.push){var e=new Error('push');e.status=403;throw e;}
    GH.branch=repo.default_branch;GH.isAdmin=!!repo.permissions.admin;
    GH.me=user.login;GH.name=user.name||user.login;
    return loadDataFromGitHub();
  }).then(function(){
    try{(remember?localStorage:sessionStorage).setItem('flipo-gh-token',token);}catch(e){}
    ui.canEdit=true;ui.admin=true;ui.loading=false;ui.loadError=false;
  }).catch(function(e){GH.token=null;GH.me='';GH.isAdmin=false;throw e;});
}
function logout(){
  try{localStorage.removeItem('flipo-gh-token');sessionStorage.removeItem('flipo-gh-token');}catch(e){}
  GH.token=null;GH.me='';GH.name='';GH.isAdmin=false;ui.canEdit=false;ui.admin=false;ui.draft=null;ui.imp=null;ui.view='library';route();toast('Déconnecté.');
}
function viewLogin(){
  var repoOk=GH.owner&&GH.repo;
  return '<div class="modal-bg" data-action="login-close"><form class="modal" id="login-form" role="dialog" aria-modal="true" aria-labelledby="lg-t">'+
    '<h2 id="lg-t">'+ic('pen',20)+' Espace enseignant</h2>'+
    (repoOk?'<p>Colle ta clé d’accès GitHub personnelle pour le dépôt <strong>'+esc(GH.owner+'/'+GH.repo)+'</strong>. Elle reste dans ce navigateur et n’est envoyée qu’à GitHub. Tes paquets sont signés avec ton nom GitHub.</p>'+
      '<label class="field"><span>Clé d’accès GitHub</span><input id="gh-token" type="password" autocomplete="current-password" placeholder="github_pat_… ou ghp_…" required></label>'+
      '<label class="check"><input type="checkbox" id="gh-remember">Rester connecté sur cet appareil</label>'+
      (ui.loginErr?'<p class="err" role="alert">'+esc(ui.loginErr)+'</p>':'')+
      '<div class="btns"><button type="button" class="btn ghost" data-action="login-close">Annuler</button><button type="submit" class="btn primary" '+(ui.loginBusy?'disabled':'')+'>'+(ui.loginBusy?'Vérification…':'Se connecter')+'</button></div>'
    :'<p>Le dépôt GitHub n’a pas pu être détecté depuis cette adresse. Renseigne <strong>CONFIG</strong> en haut du script de index.html.</p><div class="btns"><button type="button" class="btn primary" data-action="login-close">Fermer</button></div>')+
  '</form></div>';
}
document.addEventListener('submit',function(e){
  if(e.target.id!=='login-form')return;e.preventDefault();
  var tok=document.getElementById('gh-token').value.trim(),rem=document.getElementById('gh-remember').checked;if(!tok)return;
  ui.loginBusy=true;ui.loginErr='';render();
  tryLogin(tok,rem).then(function(){ui.login=false;ui.loginBusy=false;route();toast('Bonjour '+GH.name+' ! Mode enseignant activé.');})
  .catch(function(err){ui.loginBusy=false;ui.loginErr=ghErr(err);render();});
});

function save(){
  var d=ui.draft;if(!d||ui.saving)return;
  var p=parseCards(d.raw);
  var rec={id:d.id,title:(d.title||'').trim()||'Sans titre',desc:(d.desc||'').trim(),level:(d.level||'').trim(),color:d.color,lang:d.lang,published:!!d.published,cards:p.ok,updatedAt:Date.now()};
  ui.saving=true;render();
  commit(function(){
    var cur=rec.id&&getS(rec.id);
    if(cur){
      if(!mine(cur))throw new Error('owner');
      rec.owner=cur.owner;rec.ownerName=cur.owner===GH.me?GH.name:cur.ownerName;
      DATA.decks[DATA.decks.indexOf(cur)]=norm(clone(rec));
    }else{
      var base=slug(rec.title),id=base,i=2;while(getS(id))id=base+'-'+(i++);
      rec.id=id;rec.owner=GH.me;rec.ownerName=GH.name;DATA.decks.push(norm(clone(rec)));
    }
  },'Flipo : '+rec.title+' ('+rec.cards.length+' cartes, '+GH.me+')').then(function(){
    ui.saving=false;ui.draft=null;ui.view='seq';ui.test=null;ui.fc=null;ui.defi.sel=null;
    var h='#/s/'+encodeURIComponent(rec.id);if(location.hash===h)route();else location.hash=h;
    window.scrollTo(0,0);toast(rec.published?'Enregistré. Les élèves verront la mise à jour d’ici une à deux minutes.':'Enregistré en brouillon : les élèves ne le voient pas encore.');
  }).catch(function(e){
    ui.saving=false;render();toast(ghErr(e));
    if(e&&e.status===401)logout();
  });
}
function removeSeq(){
  var d=ui.draft;
  ui.saving=true;render();
  commit(function(){
    var cur=getS(d.id);if(cur&&!mine(cur))throw new Error('owner');
    DATA.decks=DATA.decks.filter(function(x){return x.id!==d.id;});
  },'Flipo : suppression de '+(d.title||'un paquet')+' ('+GH.me+')').then(function(){
    ui.saving=false;ui.draft=null;ui.confirmDel=false;ui.view='library';ui.defi.sel=null;ui.test=null;
    if(location.hash==='#/')route();else location.hash='#/';toast('Paquet supprimé.');
  }).catch(function(e){ui.saving=false;render();toast(ghErr(e));});
}
function refreshEditor(){
  var st=document.getElementById('st-vocab');if(st)st.innerHTML=statusHtml();
  var pv=document.getElementById('pv');if(pv)pv.innerHTML=previewHtml();
}

/* ================= Actions ================= */
var lastInp=null;
function act(a,t){
  var s=getS(ui.id),v=t.dataset.v;
  switch(a){
    case 'toggle-admin':ui.admin=!ui.admin;if(!ui.admin&&ui.view==='edit'){ui.draft=null;ui.view='library';}if(ui.view==='edit')render();else route();break;
    case 'new':startNew();break;
    case 'edit':var ss=getS(t.dataset.id);if(ss&&canEdit(ss))startEdit(ss);break;
    case 'cancel-edit':ui.draft=null;ui.view='library';route();break;
    case 'save':save();break;
    case 'delete':if(!ui.confirmDel){ui.confirmDel=true;render();return;}removeSeq();break;
    case 'ed-sort':
      var ps=parseCards(ui.draft.raw).ok,g=cats({cards:ps});
      ui.draft.raw=toRaw([].concat.apply([],g.map(function(c){return c.items.map(function(it){return it.w;}).sort(function(x,y){return fold(x.q).replace(ARTS,'').localeCompare(fold(y.q).replace(ARTS,''));});})));
      render();toast('Cartes triées par ordre alphabétique.');break;
    case 'ed-dedup':
      var seen={},before=parseCards(ui.draft.raw).ok,after=before.filter(function(w){var k=fold(w.q);if(seen[k])return false;seen[k]=1;return true;});
      ui.draft.raw=toRaw(after);render();toast((before.length-after.length)+' doublon'+(before.length-after.length>1?'s':'')+' retiré'+(before.length-after.length>1?'s':'')+'.');break;
    case 'csv-model':
      var blob=new Blob([CSV_MODEL],{type:'text/csv;charset=utf-8'}),url=URL.createObjectURL(blob),ln=document.createElement('a');
      ln.href=url;ln.download='flipo-modele.csv';document.body.appendChild(ln);ln.click();ln.remove();setTimeout(function(){URL.revokeObjectURL(url);},1000);break;
    case 'imp-close':if(ui.imp&&!ui.imp.busy){ui.imp=null;render();}break;
    case 'imp-go':runImport();break;
    case 'clear-q':ui.q='';render();var si=document.querySelector('[data-input="q"]');if(si)si.focus();break;
    case 'level':ui.level=v;render();break;
    case 'teacher':ui.teacher=v;render();break;
    case 'speak':speak(t.dataset.t,t.dataset.l);break;
    case 'hide':ui.hide=v;ui.rev={};render();break;
    case 'reveal':ui.rev[t.dataset.k]=true;render();break;
    case 'known':if(s){var w=s.cards[+t.dataset.i];setKnown(s.id,w,!isKnown(s.id,w));render();}break;
    /* Cartes */
    case 'fc-dir':ui.fcSet.dir=v;render();break;
    case 'fc-only':ui.fcSet.only=v==='todo';render();break;
    case 'fc-start':if(s){fcStart(s);render();}break;
    case 'fc-flip':if(ui.fc&&ui.fc.queue.length){ui.fc.flip=!ui.fc.flip;render();}break;
    case 'fc-yes':if(ui.fc){var c1=ui.fc.queue.shift();setKnown(ui.fc.sid,c1,true);ui.fc.flip=false;render();}break;
    case 'fc-no':if(ui.fc){var c2=ui.fc.queue.shift();setKnown(ui.fc.sid,c2,false);ui.fc.again++;var at=Math.min(ui.fc.queue.length,3+Math.floor(Math.random()*3));ui.fc.queue.splice(at,0,c2);ui.fc.flip=false;render();}break;
    case 'fc-stop':ui.fc=null;render();break;
    /* Test d'un paquet */
    case 't-mode':ui.tSet.mode=v;render();break;
    case 't-dir':ui.tSet.dir=v;render();break;
    case 't-n':ui.tSet.n=+v;render();break;
    case 't-start':if(s){ui.test=newTest(s.id,[s.id],ui.tSet);ui.af=true;render();}break;
    /* Défi */
    case 'defi-mode':ui.defi.mode=v;render();break;
    case 'defi-dir':ui.defi.dir=v;render();break;
    case 'defi-n':ui.defi.n=+v;render();break;
    case 'defi-pick':ui.defi.sel[t.dataset.id]=!ui.defi.sel[t.dataset.id];render();break;
    case 'defi-all':visible().forEach(function(x){ui.defi.sel[x.id]=true;});render();break;
    case 'defi-none':ui.defi.sel={};render();break;
    case 'defi-start':var ids=defiIds();if(!ids.length){toast('Choisis au moins un paquet.');return;}ui.test=newTest('defi',ids,ui.defi);ui.af=true;render();break;
    /* Déroulé du test */
    case 't-pick':tAnswer(null,+t.dataset.k);break;
    case 't-check':tAnswer(ui.test?ui.test.val:'');break;
    case 't-next':tNext();break;
    case 't-again':var ot=ui.test;ui.test=newTest(ot.ctx,ot.ids,ot.set);ui.af=true;render(false);break;
    case 't-retry':var rt=ui.test,bad=rt.res.filter(function(r){return r.r!=='ok';}).map(function(r){return {w:r.q.w,sid:r.q.sid};});
      ui.test=newTest(rt.ctx,rt.ids,rt.set,shuffle(bad));ui.af=true;render(false);break;
    case 't-stop':ui.test=null;render();break;
    case 'acc':
      var el=document.activeElement&&document.activeElement.matches&&document.activeElement.matches('input.dr-in')?document.activeElement:(lastInp&&document.body.contains(lastInp)?lastInp:null);
      if(!el||el.readOnly)return;
      var ch=t.dataset.ch,s0=el.selectionStart==null?el.value.length:el.selectionStart,s1=el.selectionEnd==null?s0:el.selectionEnd;
      el.value=el.value.slice(0,s0)+ch+el.value.slice(s1);el.focus();el.setSelectionRange(s0+ch.length,s0+ch.length);
      el.dispatchEvent(new Event('input',{bubbles:true}));break;
    case 'login-open':ui.login=true;ui.loginErr='';render();break;
    case 'login-close':if(ui.loginBusy)return;ui.login=false;render();break;
    case 'logout':logout();break;
  }
}
document.addEventListener('mousedown',function(e){if(e.target.closest&&e.target.closest('.acc-b'))e.preventDefault();});
document.addEventListener('focusin',function(e){if(e.target.matches&&e.target.matches('input.dr-in'))lastInp=e.target;});
document.addEventListener('click',function(e){
  var t=e.target.closest('[data-action]');
  if(!t){if(ui.confirmDel){ui.confirmDel=false;render();}return;}
  if(t.disabled)return;
  if(t.classList.contains('modal-bg')&&e.target!==t)return;
  if(t.dataset.action!=='delete'&&ui.confirmDel)ui.confirmDel=false;
  act(t.dataset.action,t);
});
var qT;
document.addEventListener('input',function(e){
  var t=e.target,k=t.dataset&&t.dataset.input;if(!k)return;
  if(k==='q'){ui.q=t.value;clearTimeout(qT);qT=setTimeout(function(){var l=document.getElementById('lib');if(l)l.innerHTML=libHtml();},80);return;}
  if(k==='t'&&ui.test){ui.test.val=t.value;return;}
  if(k==='imp-title'&&ui.imp){ui.imp.title=t.value;return;}
  var d=ui.draft;if(!d)return;
  if(k==='field')d[t.dataset.f]=t.value;
  else if(k==='raw'){d.raw=t.value;clearTimeout(qT);qT=setTimeout(refreshEditor,150);}
});
document.addEventListener('change',function(e){
  var t=e.target,k=t.dataset&&t.dataset.input;if(!k)return;
  if(k==='bulk-csv'){readFile(t,openImport);return;}
  var d=ui.draft;if(!d)return;
  if(k==='ed-csv'){readFile(t,function(text){
    var p=csvCards(parseCSV(text));
    if(!p.cards.length){toast('Aucune carte reconnue dans ce fichier.');return;}
    d.raw=(d.raw.trim()?d.raw.replace(/\s+$/,'')+'\n\n':'')+toRaw(p.cards);
    render();toast(p.cards.length+' carte'+(p.cards.length>1?'s':'')+' ajoutée'+(p.cards.length>1?'s':'')+'. Vérifie l’aperçu, puis enregistre.');
  });return;}
  if(k==='field')d[t.dataset.f]=t.value;
  else if(k==='color')d.color=t.value;
  else if(k==='pub')d.published=t.value==='1';
});
document.addEventListener('keydown',function(e){
  if(e.key==='Escape'&&ui.imp&&!ui.imp.busy){ui.imp=null;render();return;}
  if(e.key==='Escape'&&ui.login&&!ui.loginBusy){ui.login=false;render();return;}
  var t=e.target,typing=t.matches&&t.matches('input,textarea,select');
  /* Test */
  if(ui.test&&(ui.view==='seq'&&ui.tab==='test'||ui.view==='defi')&&ui.test.i<ui.test.items.length){
    if(e.key==='Enter'){
      if(ui.test.phase==='fb'){e.preventDefault();tNext();return;}
      if(t.matches&&t.matches('input.dr-in')){e.preventDefault();tAnswer(ui.test.val);return;}
    }
    if(!typing&&ui.test.phase==='ask'&&ui.test.set.mode==='qcm'&&/^[1-4]$/.test(e.key)){var q=ui.test.items[ui.test.i];if(+e.key<=q.opts.length){e.preventDefault();tAnswer(null,+e.key-1);}return;}
  }
  /* Cartes */
  if(!typing&&ui.view==='seq'&&ui.tab==='cartes'&&ui.fc&&ui.fc.queue.length){
    if(e.key===' '){e.preventDefault();act('fc-flip',e.target);}
    else if(ui.fc.flip&&(e.key==='ArrowRight'))act('fc-yes',e.target);
    else if(ui.fc.flip&&(e.key==='ArrowLeft'))act('fc-no',e.target);
  }
});

render(false);

/* Démarrage : clé mémorisée → données fraîches depuis GitHub ; sinon data.json public */
(function(){
  var tok=null;try{tok=sessionStorage.getItem('flipo-gh-token')||localStorage.getItem('flipo-gh-token');}catch(e){}
  var pub=function(){
    return fetch('data.json?v='+Date.now(),{cache:'no-store'}).then(function(r){if(!r.ok)throw 0;return r.json();})
      .then(function(j){setData(j);ui.loading=false;route();})
      .catch(function(){ui.loading=false;ui.loadError=true;render(false);});
  };
  if(tok&&GH.owner){
    var rem=false;try{rem=localStorage.getItem('flipo-gh-token')===tok;}catch(e){}
    tryLogin(tok,rem).then(function(){route();}).catch(function(){try{localStorage.removeItem('flipo-gh-token');sessionStorage.removeItem('flipo-gh-token');}catch(e){}pub();});
  }else pub();
})();
})();
</script>
